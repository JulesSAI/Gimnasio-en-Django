version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: gym_db1
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      # Montamos el dump SQL para que PostgreSQL lo ejecute al inicializar el contenedor
      - ./dump_gym_db1_2.sql:/docker-entrypoint-initdb.d/dump_gym_db1_2.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gym_db1"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DB_NAME=gym_db1
      - DB_USER=postgres
      - DB_PASSWORD=admin
      - DB_HOST=db
      - DB_PORT=5432
    depends_on:
      db:
        condition: service_healthy
